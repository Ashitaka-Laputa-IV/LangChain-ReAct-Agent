# ==============================================
# LangChain ReAct Agent · 智能客服
# 安装：uv sync   或   pip install .
# ==============================================

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "langchain-react-agent"
version = "0.1.0"
description = "基于 LangChain / LangGraph 的 ReAct Agent 智能客服系统，集成 RAG 检索增强与动态提示词切换"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "lhh737" }]
keywords = ["langchain", "langgraph", "react-agent", "rag", "streamlit"]

dependencies = [
    # LangChain 核心（create_agent / agents.middleware 为 1.x API）
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<0.5.0",      # ChatTongyi / DashScopeEmbeddings

    # 向量数据库
    "langchain-chroma>=1.0.0,<2.0.0",
    "chromadb>=1.3.5,<2.0.0",                  # 下限由 langchain-chroma 决定
    "langchain-text-splitters>=1.0.0,<2.0.0",

    # Agent 编排
    "langgraph>=1.0.0,<2.0.0",

    # 前端
    "streamlit>=1.40.1,<2.0.0",

    # 文档处理
    "pypdf>=5.1.0,<7.0.0",
    "pyyaml>=6.0.2,<7.0.0",

    # 阿里云百炼模型
    "dashscope>=1.20.14,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["agent", "model", "rag", "utils"]
